<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="340" fill="#212134"/>
  <rect x="20" y="20" width="860" height="300" rx="6" fill="#181826" stroke="#32324d"/>
  <text x="44" y="56" fill="#c0c0cf" font-size="15"><tspan fill="#7b79ff" font-weight="600">Unused-media</tspan> / General</text>
  <text x="836" y="56" fill="#8e8ea9" font-size="18" text-anchor="end">✕</text>
  <line x1="20" y1="76" x2="880" y2="76" stroke="#32324d"/>

  <g font-size="13">
    <g transform="translate(0,120)">
      <text x="64" y="4" fill="#8e8ea9">CAN <tspan fill="#7b79ff">ACCESS UNUSED MEDIA</tspan> WHEN</text>
      <rect x="360" y="-18" width="460" height="40" rx="4" fill="#26263f" stroke="#4945ff"/>
      <text x="380" y="6" fill="#c0c0cf">Is creator</text>
      <text x="800" y="6" fill="#8e8ea9" text-anchor="end">▾</text>
    </g>
    <g transform="translate(0,180)">
      <text x="64" y="4" fill="#8e8ea9">CAN <tspan fill="#7b79ff">DELETE UNUSED MEDIA</tspan> WHEN</text>
      <rect x="360" y="-18" width="460" height="40" rx="4" fill="#26263f" stroke="#4a4a6a"/>
      <text x="800" y="6" fill="#8e8ea9" text-anchor="end">▾</text>
    </g>
    <g transform="translate(0,240)">
      <text x="64" y="4" fill="#8e8ea9">CAN <tspan fill="#7b79ff">MANAGE IGNORE-LIST</tspan> WHEN</text>
      <rect x="360" y="-18" width="460" height="40" rx="4" fill="#26263f" stroke="#4a4a6a"/>
      <text x="800" y="6" fill="#8e8ea9" text-anchor="end">▾</text>
    </g>
  </g>

  <line x1="20" y1="278" x2="880" y2="278" stroke="#32324d"/>
  <rect x="44" y="294" width="90" height="34" rx="4" fill="#181826" stroke="#4a4a6a"/>
  <text x="89" y="316" fill="#c0c0cf" font-size="13" text-anchor="middle">Cancel</text>
  <rect x="780" y="294" width="76" height="34" rx="4" fill="#4945ff"/>
  <text x="818" y="316" fill="#fff" font-size="13" text-anchor="middle">Apply</text>
</svg>
